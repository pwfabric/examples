name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The packs and the published `pwf` move without the examples: a weekly
  # run catches a change that breaks one of them.
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No secrets: a pull request from a fork runs exactly what a maintainer's does.
permissions:
  contents: read

jobs:
  # Every example: `pwf add` for each pack it requires, `pwf validate` and
  # `pwf build` in a temporary copy, with the published `pwf` and the packs
  # built from pwfabric/packs main.
  ci:
    name: add, validate and build every example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: examples
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: pwfabric/packs
          persist-credentials: false
          path: packs
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: packs/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build the packs
        working-directory: packs
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Check the examples with the published pwf (@pwfabric/cli@3)
        working-directory: examples
        run: node check.mjs --packs ../packs/dist
