name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The published `pwf` moves without the examples: a weekly run catches a
  # release that breaks one of them.
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No secrets: a pull request from a fork runs exactly what a maintainer's does.
permissions:
  contents: read

jobs:
  # Every example: `pwf add` for each pack it requires, `pwf validate` and
  # `pwf build` in a temporary copy, with the published `pwf` and the released
  # packs the examples pin.
  ci:
    name: add, validate and build every example
    runs-on: ubuntu-latest
    env:
      # The pack releases the examples pin (pwfabric/packs release tags).
      PACKS: foundation@2.0.0 widgets@2.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: examples
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Download the released packs
        run: |
          mkdir packs
          cd packs
          for release in $PACKS; do
            file="${release%@*}-${release#*@}.pwpack"
            base="https://github.com/pwfabric/packs/releases/download/${release/@/%40}"
            curl -fsSL --retry 3 -o "$file" "$base/$file"
            curl -fsSL --retry 3 -o "$file.sha256" "$base/$file.sha256"
            sha256sum -c "$file.sha256"
          done
      - name: Check the examples with the published pwf (@pwfabric/cli@^3.5.0)
        working-directory: examples
        run: node check.mjs --packs ../packs
